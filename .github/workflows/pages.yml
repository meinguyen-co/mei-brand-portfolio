name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify stored portfolio media
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path('media-manifest.json').read_text())
          for item in manifest:
              path=Path('dist')/item['path']
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=item['sha256']:
                  raise SystemExit('Missing or changed media: '+item['path'])
          print('Verified',len(manifest),'media files')
          PY
      - name: Validate source
        run: |
          test -f dist/index.html
          node --check dist/app.js
          node --check dist/content.js
          node --check dist/refinements.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
